# Tangelo – Windows build (MSYS2 / clang64)
#
# Builds tangelo-qt for Windows and uploads a ready-to-run zip as a build artifact.
# Any *.patch files in the repository's patches/ folder are applied before building,
# so fixes can be tested without using git locally.
#
# Run it by hand: GitHub → Actions → "Windows build" → "Run workflow".

name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["*"]

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: windows
      TARGET: msys2
    steps:
      - name: Disable line ending translation
        shell: pwsh
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The whole history, so the build number (commits since Tangelo's first commit) can
          # be counted.
          fetch-depth: 0

      - name: Apply patches from patches/
        shell: bash
        run: |
          shopt -s nullglob
          patches=(patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No patches to apply."
            exit 0
          fi
          for p in "${patches[@]}"; do
            echo "Applying $p"
            git apply --whitespace=nowarn "$p"
          done
          # Build number = commits since Tangelo's first commit + the patches applied here
          # (each patch would be one commit), e.g. "Tangelo - Build 105 - <commit>".
          commits=$(git rev-list --count 2ff2af57139673621a047ed9baa4c591e0694b47..HEAD)
          echo "TANGELO_BUILD_NUMBER=$((commits + 1 + ${#patches[@]}))" >> "$GITHUB_ENV"
          echo "Build number: $((commits + 1 + ${#patches[@]}))"

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-msys2-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-msys2-

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: clang64
          update: true
          install: git make p7zip
          pacboy: >-
            toolchain:p ccache:p cmake:p ninja:p spirv-tools:p
            qt6-base:p qt6-multimedia:p qt6-multimedia-wmf:p qt6-tools:p qt6-translations:p

      - name: Build
        run: ./.ci/windows.sh

      - name: Pack
        run: ./.ci/pack.sh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tangelo-windows-msys2
          path: artifacts/
